<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Oswald:wght@500;600;700&display=swap">

<style>
/* ═══ tokens ═══════════════════════════════════════════════════
   Единая светлая тема: страница — это документ на белой бумаге.
   Оба фирменных цвета взяты пипеткой с эмблемы. */
:root{
  --violet:#650DB9;        /* эмблема, кольцо */
  --violet-deep:#3D0770;
  --violet-ink:#26044A;
  --gold:#FBD800;          /* эмблема, поле */

  --paper:#FFFFFF;
  --surface:#F8F5FD;
  --surface-2:#F0EAFA;
  --line:#E5DCF4;
  --ink:#191325;
  --muted:#6B6383;
  --ok:#177A3D;

  --col:600px;
  --r:14px;
  --pad:clamp(18px,5vw,26px);

  --f-display:Oswald,"Arial Narrow",system-ui,sans-serif;
  --f-body:"Golos Text",-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-data:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--f-body);
  font-size:16px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--violet);outline-offset:3px;border-radius:6px}

.col{width:min(var(--col),100%);margin-inline:auto;padding-inline:var(--pad)}

/* ═══ переключатель языка ══════════════════════════════════════ */
.lang{
  position:fixed;top:12px;right:12px;z-index:60;display:flex;gap:2px;
  background:rgba(255,255,255,.92);backdrop-filter:blur(8px);
  border:1px solid var(--line);border-radius:999px;padding:3px;
  box-shadow:0 4px 16px rgba(38,4,74,.1);
}
.lang button{
  border:0;background:none;cursor:pointer;font-family:var(--f-body);
  font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted);
  padding:5px 11px;border-radius:999px;
}
.lang button[aria-pressed="true"]{background:var(--violet);color:#fff}
.lang{transition:opacity .2s,transform .2s}
/* просмотрщик перекрывает страницу — переключатель под ним только мешает */
body.lb-open .lang{display:none}
/* при листании вниз убираем: иначе плашка закрывает угол карточек */
body.lang-away .lang{opacity:0;transform:translateY(-16px);pointer-events:none}

/* ═══ шапка: полоса эмблемы ════════════════════════════════════
   Пурпурная лента проходит за нижней третью логотипа — тот же приём,
   что и в самой эмблеме, где полоса «UZBEKISTAN» пересекает круг. */
.head{position:relative;padding:44px 0 0;text-align:center;overflow:hidden}
.head .band{
  position:absolute;left:0;right:0;top:126px;height:68px;
  background:var(--violet);
}
.head .band::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--gold);
}
.crest{
  position:relative;width:150px;height:150px;display:block;margin:0 auto;
  border-radius:50%;background:#fff;
  box-shadow:0 0 0 5px #fff,0 12px 28px rgba(38,4,74,.34);
}
.head .col{position:relative;padding-top:22px}

.legal{
  font-family:var(--f-display);font-weight:600;
  font-size:clamp(21px,5.6vw,29px);line-height:1.16;letter-spacing:.005em;
  text-transform:uppercase;color:var(--ink);
}
.trading{
  margin-top:9px;font-size:clamp(10px,2.6vw,11.5px);font-weight:700;
  letter-spacing:.28em;padding-left:.28em;text-transform:uppercase;color:var(--violet);
}


/* ═══ быстрые действия ═════════════════════════════════════════ */
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:30px}
.qbtn{
  display:flex;flex-direction:column;align-items:center;gap:7px;
  padding:14px 4px 12px;border-radius:var(--r);text-decoration:none;
  background:var(--surface);border:1px solid var(--line);
  color:var(--violet-ink);font-size:11.5px;font-weight:600;
  transition:background .15s,border-color .15s,transform .15s;
}
.qbtn svg{width:21px;height:21px;stroke:var(--violet)}
.qbtn:hover{background:#fff;border-color:var(--violet);transform:translateY(-2px)}

.cta{
  display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
  margin-top:9px;padding:15px;border:0;border-radius:var(--r);cursor:pointer;
  background:var(--violet);color:#fff;text-decoration:none;
  font-family:var(--f-body);font-size:15px;font-weight:600;
  box-shadow:0 8px 22px rgba(101,13,185,.26);
  transition:background .15s,transform .15s;
}
.cta:hover{background:var(--violet-deep);transform:translateY(-2px)}
.cta svg{width:19px;height:19px;stroke:var(--gold)}

/* ═══ секции ═══════════════════════════════════════════════════ */
section{padding:38px 0 0}
.eyebrow{
  display:flex;align-items:center;gap:11px;margin-bottom:16px;
  font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;
  color:var(--violet);
}
.eyebrow::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,var(--gold),rgba(251,216,0,0))}

/* строки «нажми — скопируется» */
.rows{display:grid;gap:7px}
.row{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;
  font-family:inherit;color:inherit;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:12px 14px;transition:border-color .15s,background .15s;
}
.row:hover{background:#fff;border-color:var(--violet)}
.row .k{display:block;font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.row .v{display:block;font-size:15px;font-weight:600;margin-top:3px;word-break:break-word;line-height:1.35}
.row .v.num{font-family:var(--f-data);font-weight:600;font-size:14.5px;font-variant-numeric:tabular-nums}
.row .txt{flex:1;min-width:0}
.row .ic{flex:none;width:18px;height:18px;stroke:var(--muted);opacity:.55;transition:opacity .15s}
.row:hover .ic{opacity:1;stroke:var(--violet)}
.row.copied{background:#F1FAF3;border-color:var(--ok)}
.row.copied .ic{stroke:var(--ok);opacity:1}

/* ═══ лицензия ═════════════════════════════════════════════════ */
.facts{display:grid;gap:0;margin:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.fact{display:grid;grid-template-columns:minmax(0,42%) 1fr;gap:14px;padding:12px 14px;border-bottom:1px solid var(--line)}
.fact:last-child{border-bottom:0}
.fact:nth-child(odd){background:var(--surface)}
.fact dt{font-size:10.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);align-self:center}
.fact dd{margin:0;font-size:14.5px;font-weight:600;line-height:1.4}
.fact dd.num{font-family:var(--f-data);font-variant-numeric:tabular-nums}
@media(max-width:479px){
  .fact{grid-template-columns:1fr;gap:3px}
  .fact dt{align-self:start}
}

.kinds{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px}
.kinds li{position:relative;padding-left:27px;font-size:14px;color:#392F4E;line-height:1.45}
.kinds li::before{
  content:"";position:absolute;left:2px;top:6px;width:13px;height:7px;
  border-left:2.5px solid var(--violet);border-bottom:2.5px solid var(--violet);
  transform:rotate(-45deg);
}

/* ═══ документы ════════════════════════════════════════════════ */
.docs{display:grid;grid-template-columns:1fr 1fr;gap:11px}
@media(max-width:479px){.docs{grid-template-columns:1fr}}
.doc{
  display:block;width:100%;padding:0;cursor:pointer;text-align:left;font-family:inherit;
  background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  transition:border-color .15s,box-shadow .15s,transform .15s;
}
.doc:hover{border-color:var(--violet);box-shadow:0 12px 30px rgba(38,4,74,.14);transform:translateY(-3px)}
.doc .shot{display:block;position:relative;aspect-ratio:1/1;overflow:hidden;background:var(--surface-2)}
.doc .shot img{width:100%;display:block;object-fit:cover;object-position:top center;height:100%}
.doc .shot::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(255,255,255,0) 55%,rgba(38,4,74,.55));
}
.doc .zoom{
  display:flex;position:absolute;right:9px;bottom:9px;z-index:1;align-items:center;gap:6px;
  background:rgba(255,255,255,.94);border-radius:999px;padding:5px 11px;
  font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--violet);
}
.doc .zoom svg{width:13px;height:13px;stroke:var(--violet)}
.doc .cap{display:block;padding:12px 14px 14px}
.doc .cap .t{display:block;font-size:14px;font-weight:700;line-height:1.3}
.doc .cap .s{display:block;font-size:12px;color:var(--muted);margin-top:3px;font-family:var(--f-data)}

/* ═══ банк ═════════════════════════════════════════════════════ */
.bank{background:var(--violet-ink);border-radius:20px;padding:24px 18px 22px;color:#fff}
.bank .eyebrow{color:var(--gold)}
.bank .eyebrow::after{background:linear-gradient(90deg,rgba(251,216,0,.55),rgba(251,216,0,0))}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tab{
  flex:1;min-width:64px;cursor:pointer;font-family:var(--f-body);
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:#D6C9EC;
  border-radius:10px;padding:9px 6px;font-size:12.5px;font-weight:700;letter-spacing:.06em;
  transition:background .15s,color .15s,border-color .15s;
}
.tab[aria-selected="true"]{background:var(--gold);color:var(--violet-ink);border-color:var(--gold)}
.brows{display:grid;gap:7px}
.brow{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;
  font-family:inherit;color:#fff;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.13);
  border-radius:11px;padding:11px 13px;transition:background .15s,border-color .15s;
}
.brow:hover{background:rgba(255,255,255,.12);border-color:rgba(251,216,0,.6)}
.brow .k{display:block;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#AC9CC9}
.brow .v{display:block;font-size:14px;font-weight:600;margin-top:3px;word-break:break-word;line-height:1.35}
.brow .v.num{font-family:var(--f-data);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.brow .txt{flex:1;min-width:0}
.brow .ic{flex:none;width:17px;height:17px;stroke:#AC9CC9;transition:stroke .15s}
.brow:hover .ic{stroke:var(--gold)}
.brow.copied{background:rgba(251,216,0,.16);border-color:var(--gold)}
.brow.copied .ic{stroke:var(--gold)}
.copyall{
  display:flex;align-items:center;justify-content:center;gap:9px;width:100%;margin-top:11px;
  padding:13px;border:0;border-radius:11px;cursor:pointer;background:var(--gold);
  color:var(--violet-ink);font-family:var(--f-body);font-size:14px;font-weight:700;
  transition:filter .15s;
}
.copyall:hover{filter:brightness(1.07)}
.copyall svg{width:17px;height:17px;stroke:var(--violet-ink)}


/* ═══ подвал ═══════════════════════════════════════════════════ */
footer{
  position:relative;margin-top:40px;padding:34px 0 74px;
  background:var(--violet-ink);color:#CDBFE6;overflow:hidden;
}
/* уходящая к горизонту золотая сетка — мотив дороги/поля с эмблемы */
footer::before{
  content:"";position:absolute;left:-45%;right:-45%;bottom:0;height:520px;
  background:
    repeating-linear-gradient(90deg,transparent 0 70px,rgba(251,216,0,.40) 70px 73px),
    repeating-linear-gradient(0deg,transparent 0 46px,rgba(251,216,0,.28) 46px 49px);
  transform:perspective(620px) rotateX(75deg);transform-origin:bottom center;
  -webkit-mask-image:linear-gradient(to top,#000 4%,transparent 60%);
  mask-image:linear-gradient(to top,#000 4%,transparent 60%);
  pointer-events:none;
}
footer .col{position:relative;text-align:center}
footer .fname{font-family:var(--f-display);font-weight:600;font-size:16px;letter-spacing:.02em;text-transform:uppercase;color:#fff}
footer .faddr{margin-top:8px;font-size:13px;line-height:1.5}
footer .fmeta{margin-top:14px;font-size:11.5px;color:#8F81AC;font-family:var(--f-data)}
footer a{color:var(--gold);text-decoration:none;border-bottom:1px solid rgba(251,216,0,.4)}

/* ═══ лайтбокс документа ═══════════════════════════════════════ */
.lb{position:fixed;inset:0;z-index:100;display:none;background:rgba(20,3,40,.94)}
.lb.on{display:flex;flex-direction:column}
.lb-bar{
  display:flex;align-items:center;gap:10px;padding:12px 14px;
  border-bottom:1px solid rgba(255,255,255,.12);flex:none;
}
.lb-title{flex:1;min-width:0;color:#fff;font-size:13.5px;font-weight:600;line-height:1.3}
.lb-title span{display:block;font-family:var(--f-data);font-size:11.5px;color:#AC9CC9;font-weight:400}
.lb-btn{
  display:inline-flex;align-items:center;gap:7px;flex:none;cursor:pointer;
  font-family:var(--f-body);font-size:12.5px;font-weight:600;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;
  border-radius:999px;padding:8px 14px;transition:background .15s;text-decoration:none;
}
.lb-btn:hover{background:rgba(255,255,255,.2)}
.lb-btn.gold{background:var(--gold);border-color:var(--gold);color:var(--violet-ink)}
.lb-btn svg{width:15px;height:15px;stroke:currentColor}
.lb-btn.icon{padding:8px;border-radius:50%}
.lb-scroll{flex:1;overflow:auto;padding:14px;-webkit-overflow-scrolling:touch;text-align:center}
.lb-scroll img{
  width:min(760px,100%);height:auto;border-radius:8px;background:#fff;
  box-shadow:0 20px 60px rgba(0,0,0,.5);transition:width .2s ease;
}
.lb-scroll img.zoomed{width:max(1400px,180%);border-radius:0;cursor:zoom-out}
.lb-scroll img:not(.zoomed){cursor:zoom-in}

/* ═══ тост ═════════════════════════════════════════════════════ */
.toast{
  position:fixed;left:50%;bottom:24px;transform:translate(-50%,22px);z-index:200;
  background:var(--violet-ink);color:#fff;border:1px solid rgba(251,216,0,.5);
  padding:11px 22px;border-radius:999px;font-size:14px;font-weight:600;
  opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;
  max-width:calc(100% - 32px);text-align:center;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
}
</style>

<section id="bank">
  <div class="col">
    <div class="bank">
      <p class="eyebrow"><span data-t="secBank"></span></p>
      <div class="tabs" role="tablist" id="curTabs"></div>

const LIC_KINDS = [

  {ru:"Турагентская деятельность — выездной туризм, включая медицинский и образовательный",

  {ru:"Турагентская деятельность — въездной туризм, привлечение иностранных граждан в Узбекистан",

/* Банк один на все валюты — меняется только номер счёта. */
const BANK_NAME = {

  uz:"«Kapital 24» — Kapitalbankning chakana biznes filiali",

};
const ACCOUNTS = {
  UZS:{label:"UZS", acc:"20208 000 4072 3444 1001", raw:"20208000407234441001"},
  USD:{label:"USD", acc:"20208 840 7072 3444 1001", raw:"20208840707234441001"},
  EUR:{label:"EUR", acc:"20208 978 9072 3444 1001", raw:"20208978907234441001"},

function bankRows(code){

  return [
    {k:{ru:"Банк", uz:"Bank", en:"Bank"}, v:BANK_NAME},
    {k:{ru:"МФО", uz:"MFO", en:"MFO"}, v:"01158", num:1},
    {k:{ru:"Расчётный счёт", uz:"Hisob raqami", en:"Account"}, v:a.acc, num:1, copy:a.raw},
    {k:{ru:"SWIFT", uz:"SWIFT", en:"SWIFT"}, v:"KACHUZ22", num:1},
    {k:{ru:"ИНН", uz:"STIR", en:"TIN"}, v:"312 097 521", num:1, copy:"312097521"}
  ];
}

const DOCS = {
  lic:{
    t:{ru:"Лицензия на туристическую деятельность",
       uz:"Turizm faoliyati uchun litsenziya",
       en:"Tourism activity licence"},
    s:{ru:"№ 749920 · 02.05.2025", uz:"№ 749920 · 02.05.2025", en:"No. 749920 · 02.05.2025"},
    img:"assets/lic_full.webp", pdf:"assets/lic.pdf", file:"GT-Marketing-Tourism-licence-749920"
  },
  cert:{
    t:{ru:"Свидетельство о государственной регистрации",
       uz:"Davlat ro‘yxatidan o‘tkazilganlik to‘g‘risida guvohnoma",
       en:"Certificate of state registration"},
    s:{ru:"№ 2805487 · 29.04.2025", uz:"№ 2805487 · 29.04.2025", en:"No. 2805487 · 29.04.2025"},
    img:"assets/cert_full.webp", pdf:"assets/cert.pdf", file:"GT-Marketing-Tourism-registration-2805487"
  }
};

const ICON_COPY = '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2.5"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
const ICON_OK   = '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';

let lang = "ru";
let cur  = "UZS";

/* ── помощники ────────────────────────────────────────────────── */
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
                          .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
/* поле может быть строкой (одинаково на всех языках) или словарём по языкам */
const loc = f => (f && typeof f === "object") ? (f[lang] || f.ru) : f;
const t   = id => loc(T[id]);
const cpy = o => o.copy || loc(o.v);

let toastTimer;
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("on"), 2100);
}

function flash(el){
  if(!el) return;
  el.classList.add("copied");
  const ic = el.querySelector(".ic");
  if(ic) ic.outerHTML = ICON_OK;
  setTimeout(() => {
    el.classList.remove("copied");
    const j = el.querySelector(".ic");
    if(j) j.outerHTML = ICON_COPY;
  }, 1500);
}

function copy(text, el){
  const done = () => { toast(t("copied")); flash(el); };
  const legacy = () => {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;top:0;left:0;opacity:0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); done(); } catch(e){ /* тихо */ }
    document.body.removeChild(ta);
  };
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done, legacy);
  } else {
    legacy();
  }
}

/* ── рендер ───────────────────────────────────────────────────── */
function rowHTML(o, cls){
  return '<button class="' + cls + '" type="button" data-copy="' + esc(cpy(o)) + '">' +
           '<span class="txt">' +
             '<span class="k">' + esc(loc(o.k)) + '</span>' +
             '<span class="v' + (o.num ? " num" : "") + '">' + esc(loc(o.v)) + '</span>' +
           '</span>' + ICON_COPY +
         '</button>';
}

function render(){
  document.documentElement.lang = lang;

  document.querySelectorAll("[data-t]").forEach(e => { e.innerHTML = t(e.dataset.t); });
  document.getElementById("legalName").innerHTML = loc(LEGAL);
  document.getElementById("footAddr").innerHTML = loc(ADDRESS);

  document.querySelectorAll("[data-doc-title]").forEach(e => {
    e.textContent = loc(DOCS[e.dataset.docTitle].t);
  });
  document.querySelectorAll("[data-doc-sub]").forEach(e => {
    e.textContent = loc(DOCS[e.dataset.docSub].s);
  });

  document.getElementById("companyRows").innerHTML =
    COMPANY.map(o => rowHTML(o, "row")).join("");

  document.getElementById("licFacts").innerHTML = LIC_FACTS.map(o =>
    '<div class="fact"><dt>' + esc(loc(o.k)) + '</dt>' +
    '<dd' + (o.num ? ' class="num"' : "") + '>' + esc(loc(o.v)) + '</dd></div>').join("");

  document.getElementById("licKinds").innerHTML =
    LIC_KINDS.map(o => "<li>" + esc(loc(o)) + "</li>").join("");

  document.getElementById("curTabs").innerHTML = Object.keys(ACCOUNTS).map(k =>
    '<button class="tab" type="button" role="tab" data-cur="' + k + '"' +
    ' aria-selected="' + (k === cur) + '">' + ACCOUNTS[k].label + "</button>").join("");

  document.getElementById("bankRows").innerHTML =
    bankRows(cur).map(o => rowHTML(o, "brow")).join("");
}

/* ── лайтбокс документа ───────────────────────────────────────── */
const lb       = document.getElementById("lightbox");
const lbImg    = document.getElementById("lbImg");
const lbScroll = document.getElementById("lbScroll");
let openDoc = null;
let lastFocus = null;

function showDoc(id){
  const d = DOCS[id];
  if(!d) return;
  openDoc = id;
  lastFocus = document.activeElement;
  document.getElementById("lbTitle").innerHTML =
    esc(loc(d.t)) + "<span>" + esc(loc(d.s)) + "</span>";
  lbImg.src = d.img;
  lbImg.alt = loc(d.t);
  const save = document.getElementById("lbSave");
  save.href = d.pdf;
  save.setAttribute("download", d.file + ".pdf");
  lbImg.classList.remove("zoomed");
  lbScroll.scrollTop = 0;
  lb.classList.add("on");
  document.body.classList.add("lb-open");
  document.body.style.overflow = "hidden";
  document.getElementById("lbClose").focus();
}

function hideDoc(){
  lb.classList.remove("on");
  document.body.classList.remove("lb-open");
  document.body.style.overflow = "";
  openDoc = null;
  if(lastFocus) lastFocus.focus();
}

/* ── события ──────────────────────────────────────────────────── */
document.addEventListener("click", e => {
  const c = e.target.closest("[data-copy]");
  if(c){ copy(c.dataset.copy, c); return; }

  const tab = e.target.closest(".tab");
  if(tab){ cur = tab.dataset.cur; render(); return; }

  const l = e.target.closest(".lang button");
  if(l){
    lang = l.dataset.lang;
    document.querySelectorAll(".lang button")
      .forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
    render();
    if(openDoc) showDoc(openDoc);
    return;
  }

  const d = e.target.closest("[data-doc]");
  if(d){ showDoc(d.dataset.doc); return; }
});

document.getElementById("lbClose").addEventListener("click", hideDoc);
lbImg.addEventListener("click", () => lbImg.classList.toggle("zoomed"));
lb.addEventListener("click", e => { if(e.target === lb || e.target === lbScroll) hideDoc(); });
document.addEventListener("keydown", e => { if(e.key === "Escape" && openDoc) hideDoc(); });

document.getElementById("copyAll").addEventListener("click", () => {
  const head = loc(COMPANY[0].v) + " / " + t("tin") + " 312097521";
  copy(head + "\n" + ACCOUNTS[cur].label + "\n" +
       bankRows(cur).map(o => loc(o.k) + ": " + cpy(o)).join("\n"), null);
  toast(t("allCopied"));
});

/* Переключатель висит поверх страницы. Пока листают вниз — прячем,
   чтобы не закрывал угол карточек; при листании вверх возвращаем. */
let lastY = window.scrollY;
window.addEventListener("scroll", () => {
  const y = window.scrollY;
  document.body.classList.toggle("lang-away", y > 160 && y > lastY + 4);
  lastY = y;
}, {passive: true});

/* язык браузера — только если он один из наших */
const navLang = (navigator.language || "ru").slice(0, 2).toLowerCase();
if(LANGS.indexOf(navLang) !== -1) lang = navLang;
document.querySelectorAll(".lang button")
  .forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));

render();
</script>
